name: Desplegar

# En cada push a main: build y despliegue de Hosting + reglas + índices de Firestore.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    name: Build y despliegue en Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Revisar secretos
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          faltan=""
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            [ -z "${!v}" ] && faltan="$faltan $v"
          done
          [ -z "$SA" ] && faltan="$faltan FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos en GitHub:$faltan. Sigue docs/configuracion-firebase.md (paso 6)."
            exit 1
          fi

      - run: npm ci

      - name: Lint y pruebas rápidas
        run: |
          npm run lint
          npm test

      - name: Build
        run: npm run build

      - name: Credenciales de la cuenta de servicio
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Desplegar Hosting, reglas e índices
        run: npx firebase deploy --only hosting,firestore:rules,firestore:indexes --project "$VITE_FIREBASE_PROJECT_ID" --non-interactive --force

      - name: Borrar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

      - name: Resumen
        run: echo "### ✅ Desplegado en https://$VITE_FIREBASE_PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"
