<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Admin – Marcación CD (prototipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Great+Vibes&family=Dancing+Script:wght@600&display=swap">
<style>
:root{
  --blue:#0071CE;--blue-d:#004F9A;--navy:#041E42;--yellow:#FFC220;
  --bg:#F4F6FA;--card:#FFFFFF;--text:#041E42;--muted:#5A6880;--border:#E2E7EF;--track:#EEF2F8;
  --ok-bg:#E7F7EE;--ok:#0B6B3A;--warn-bg:#FFF6DB;--warn:#5C4300;--bad-bg:#FDE7E4;--bad:#9B1C10;--info-bg:#E6F0FB;--info:#004F9A;
}
body.dark{--bg:#0B1A33;--card:#12264A;--text:#EAF0FA;--muted:#A9B8D3;--border:#24406E;--track:#1B3360;
  --ok-bg:#103A27;--ok:#86E3B0;--warn-bg:#3A2E0A;--warn:#FFD766;--bad-bg:#3D1712;--bad:#FFB4A8;--info-bg:#122E55;--info:#A9CBF2}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:250px;flex-shrink:0;background:var(--navy);color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--yellow);display:flex;align-items:center;justify-content:center}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:0 12px;border-radius:10px;color:#C9D4E6;text-decoration:none;font-weight:600}
.nav:hover{background:#0A2B5C;color:#fff}
.nav.on{background:var(--blue);color:#fff}
.nav .ic{display:flex;align-items:center;gap:10px}
.badge{background:var(--yellow);color:var(--navy);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px;border-top:1px solid #1F3E6E;color:#fff;text-decoration:none}
.av{width:36px;height:36px;border-radius:18px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.main{flex:1;min-width:0;padding:24px 28px 48px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
.crumb a{text-decoration:none}
h1{margin:0;font-size:26px;font-weight:800}
h2{margin:0;font-size:16px;font-weight:700}
.sub{color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:16px}
.row>.card{flex:1 1 340px}
.kpi .l{color:var(--muted);font-size:13px}.kpi .v{font-size:32px;font-weight:800;margin:6px 0 2px}.kpi .n{color:var(--muted);font-size:12px}
.btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);white-space:nowrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.out{border-color:var(--blue);color:var(--blue);background:transparent}
.btn.ok{background:#1FA463;border-color:#1FA463;color:#fff}
.btn.danger{border-color:#C0392B;color:#C0392B;background:transparent}
.btn.sm{height:34px;padding:0 10px;font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-weight:600;cursor:pointer}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs{display:inline-flex;gap:4px;background:var(--track);padding:4px;border-radius:12px}
.tab{height:36px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted);cursor:pointer}
.tab.on{background:var(--card);color:var(--blue)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--track)}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-info{background:var(--info-bg);color:var(--info)}
.c-navy{background:var(--navy);color:var(--yellow)}.c-pur{background:#EDE7FB;color:#4B2E9B}.c-yel{background:#FFF3CC;color:#6B4E00}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.field input,.field select,.field textarea{height:42px;border-radius:10px;border:1px solid var(--border);background:var(--card);padding:0 12px;font-weight:500}
.field textarea{height:auto;padding:10px 12px;resize:vertical}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.muted{color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}.bar>div{height:10px;background:var(--blue);border-radius:5px}
.sig{font-family:'Great Vibes',cursive;font-size:34px;color:#041E42;background:#fff;border:1px solid #E2E7EF;border-radius:10px;height:72px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:14px 18px;border-radius:12px;font-weight:600;display:none;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;max-width:90vw}
.toast.show{display:flex}.toast i{width:8px;height:8px;border-radius:4px;background:var(--yellow);flex-shrink:0}
.modal{position:fixed;inset:0;background:rgba(4,30,66,.55);display:none;align-items:flex-start;justify-content:center;padding:90px 16px;z-index:40}
.modal.show{display:flex}
.dlg{width:460px;max-width:100%;background:var(--card);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.switch{width:52px;height:30px;border-radius:15px;border:0;background:#9AA7BC;position:relative;cursor:pointer;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .15s}
.switch.on{background:#1FA463}.switch.on::after{left:25px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .d{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
.burger{display:none}
.tcell{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:118px;padding:6px 10px;border:1px dashed transparent;border-radius:10px;background:transparent;cursor:pointer;text-align:left;position:relative}
.tcell:hover{border-color:var(--blue);background:var(--info-bg)}
.tcell b{font-size:16px;font-variant-numeric:tabular-nums;padding-left:14px}
.tcell span{font-size:11px;color:var(--muted);padding-left:14px}
.tcell i{position:absolute;left:10px;top:13px;width:8px;height:8px;border-radius:4px}
.tcell.empty{border-color:var(--border);color:var(--blue);font-weight:700;justify-content:center;min-height:44px}
.daysep td{background:var(--track);font-weight:700;font-size:12px;color:var(--muted);padding:8px}
.tpair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tbox{border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tbox input[type=time]{height:46px;font-size:20px;font-weight:700;border-radius:10px;border:1px solid var(--border);background:var(--card);padding:0 10px}
.tbox.focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,206,.18)}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px}
.login .box{width:420px;max-width:100%;background:#fff;color:#041E42;border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .burger{display:inline-flex}
  .main{padding:16px}
  .f2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"><i></i><span id="toastTxt"></span></div>
<div class="modal" id="modal"><div class="dlg" id="dlg" role="dialog"></div></div>

<script>
/* ===================== DATOS QUEMADOS ===================== */
const CDS = [

  {code:'7417',name:'Apopa',lat:'13.8017',lng:'-89.1793',radius:150,alert:1000,pa:'Mario Castillo',guards:7,onDuty:4,qr:false,rot:30,kiosk:null},

const SHIFTS = [

  {name:'Vespertino',range:'[hh:mm – hh:mm]',cls:'c-warn'},
  {name:'Nocturno',range:'[hh:mm – hh:mm]',cls:'c-info'}

let USERS = [
  {id:1,first:'Daniel',last:'Flores',email:'daniel.flores@gmail.com',role:'Seguridad',cd:'7417',status:'Pendiente',via:'Google',sig:null,created:'10/11/2026'},

  {id:4,first:'Ana',last:'Rivas',email:'ana.rivas@gmail.com',role:'Seguridad',cd:'5184',status:'Activo',via:'Correo',sig:{font:'Dancing Script',date:'02/09/2026',locked:false},created:'15/08/2026'},
  {id:5,first:'Rosa',last:'Hernández',email:'rosa.h@gmail.com',role:'PA',cd:'5184',status:'Activo',via:'Google',sig:null,created:'01/08/2026'},
  {id:6,first:'Mario',last:'Castillo',email:'mario.c@gmail.com',role:'PA',cd:'7417',status:'Activo',via:'Correo',sig:null,created:'01/08/2026'},
  {id:7,first:'Kiosco',last:'Garita 5184',email:'kiosco5184@gmail.com',role:'Kiosco QR',cd:'5184',status:'Activo',via:'Correo',sig:null,created:'05/09/2026'},
  {id:8,first:'Luis',last:'Aguilar',email:'luis.aguilar@gmail.com',role:'Seguridad',cd:'7417',status:'Activo',via:'Google',sig:{font:'Great Vibes',date:'20/10/2026',locked:true},created:'20/08/2026'},
  {id:9,first:'José',last:'López',email:'jose.lopez@gmail.com',role:'Seguridad',cd:'7018',status:'Bloqueado',via:'Google',sig:{font:'Dancing Script',date:'05/08/2026',locked:true},created:'01/08/2026'},
  {id:10,first:'María',last:'Pérez',email:'maria.perez@gmail.com',role:'Seguridad',cd:'7018',status:'Activo',via:'Correo',sig:{font:'Great Vibes',date:'11/09/2026',locked:true},created:'01/09/2026'},
  {id:11,first:'Pedro',last:'Ramos',email:'pedro.ramos@gmail.com',role:'Seguridad',cd:'7417',status:'Activo',via:'Google',sig:{font:'Dancing Script',date:'30/09/2026',locked:true},created:'10/09/2026'},
  {id:12,first:'Sofía',last:'Guzmán',email:'sofia.g@gmail.com',role:'Seguridad',cd:'7018',status:'Activo',via:'Correo',sig:{font:'Great Vibes',date:'10/11/2026',locked:true},created:'10/11/2026'}
];
/* Una fila = una jornada (entrada + salida del mismo turno) */
const P = (t,m,d,s) => ({t,m,d,s});
let JORN = [
  {id:1,uid:3,date:'10/11',shift:'Vespertino',in:P('13:54','QR kiosco','—','ok'),out:null},
  {id:2,uid:4,date:'10/11',shift:'Vespertino',in:P('13:48','GPS','38 m','ok'),out:null},
  {id:3,uid:8,date:'10/11',shift:'Vespertino',in:P('13:40','GPS','1.3 km','alerta'),out:null},
  {id:4,uid:10,date:'10/11',shift:'Diurno',in:P('05:58','GPS','20 m','ok'),out:P('13:05','GPS','420 m','obs')},
  {id:5,uid:11,date:'10/11',shift:'Diurno',in:P('06:02','GPS','15 m','ok'),out:P('13:02','GPS sin conexión','60 m','sync')},
  {id:6,uid:12,date:'10/11',shift:'Diurno',in:P('05:51','GPS','12 m','ok'),out:null},
  {id:7,uid:3,date:'09/11',shift:'Vespertino',in:P('13:57','GPS','25 m','ok'),out:P('22:03','GPS','30 m','ok')},
  {id:8,uid:4,date:'09/11',shift:'Vespertino',in:P('13:50','QR kiosco','—','ok'),out:P('22:01','QR kiosco','—','ok')},
  {id:9,uid:9,date:'09/11',shift:'Nocturno',in:P('22:05','GPS','40 m','ok'),out:P('06:00','Editada por admin','—','ok'),edited:true},
  {id:10,uid:8,date:'09/11',shift:'Nocturno',in:P('21:58','GPS','18 m','ok'),out:null},
  {id:11,uid:10,date:'09/11',shift:'Diurno',in:P('06:10','GPS','22 m','ok'),out:P('14:00','GPS','35 m','ok')},
  {id:12,uid:12,date:'08/11',shift:'Diurno',in:P('05:55','GPS','10 m','ok'),out:P('14:02','GPS','14 m','ok')}
];
const TODAY = '10/11';
let ALERTS = [
  {id:1,jid:3,part:'in',uid:8,sev:'Alta',text:'Entrada marcada a 1.3 km del CD (fuera del límite de 1 km)',time:'10/11 13:40',state:'abierta',dist:1300},
  {id:2,jid:4,part:'out',uid:10,sev:'Media',text:'Salida a 420 m (entre 150 m y 1 km)',time:'10/11 13:05',state:'abierta',dist:420},
  {id:3,jid:5,part:'out',uid:11,sev:'Info',text:'Marca sin conexión: hora del celular 13:02, enviada 13:20',time:'10/11 13:20',state:'abierta',dist:60},
  {id:4,jid:10,part:'out',uid:8,sev:'Media',text:'No marcó salida del turno nocturno del 09/11',time:'10/11 07:00',state:'abierta',dist:18}
];
let LOG = [
  {when:'10/11 09:12',who:'Admin principal',action:'Aprobó el registro de Sofía Guzmán (Seguridad · San Juan Opico 7018)'},
  {when:'09/11 22:40',who:'Admin principal',action:'Editó la salida de José López: 21:15 → 22:00. Motivo: verificado con hoja de papel'},
  {when:'09/11 18:03',who:'Admin principal',action:'Bloqueó a José López'},
  {when:'08/11 10:30',who:'Admin principal',action:'Cambió la retención de datos de 60 a 90 días'},
  {when:'05/11 08:15',who:'Rosa Hernández (PA)',action:'Aceptó la marca con observación de Ana Rivas'}
];
let ADMINS = [{name:'Admin principal',email:'admin.cd@gmail.com',since:'01/08/2026'}];
let REPORTS = [
  {name:'Asistencia por CD · Hortifruti 5184',range:'01/11 – 09/11',fmt:'Excel',by:'Rosa Hernández (PA)',when:'09/11 17:02'},
  {name:'Alertas de ubicación · Todos',range:'16/10 – 31/10',fmt:'PDF',by:'Admin principal',when:'01/11 08:30'}
];
let CFG = {retention:90,theme:'claro',appName:'Marcación CD',sigDays:30};
let UI = {cd:'Todos',userTab:'Pendiente',logged:false,assistDate:'Hoy',q:'',onlyIssues:false};

/* ===================== UTILIDADES ===================== */
const $ = s => document.querySelector(s);
const u = id => USERS.find(x => x.id === id);
const full = x => x.first + ' ' + x.last;
const ini = x => (x.first[0] + x.last[0]).toUpperCase();
const cdName = code => { const c = CDS.find(x => x.code === code); return c ? c.name + ' ' + c.code : code; };
const inCd = code => UI.cd === 'Todos' || UI.cd === code;
const ST = {ok:['Dentro del radio','c-ok'],obs:['Observación','c-warn'],alerta:['Fuera de 1 km','c-bad'],sync:['Sin conexión · sincronizada','c-info'],aceptada:['Aceptada','c-ok'],rechazada:['Rechazada','c-bad']};
const ROLE = {Seguridad:'c-info',PA:'c-yel','Kiosco QR':'c-pur',Admin:'c-navy'};
const USTAT = {Pendiente:'c-warn',Activo:'c-ok',Bloqueado:'c-bad'};
const SEV = {Alta:'c-bad',Media:'c-warn',Info:'c-info'};
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
function hours(j){ if(!j.out) return null; let d=toMin(j.out.t)-toMin(j.in.t); if(d<0) d+=1440; return Math.floor(d/60)+' h '+String(d%60).padStart(2,'0')+' min'; }
const RANK = {alerta:4,rechazada:4,obs:3,sync:2,ok:1,aceptada:1};
function jStatus(j){
  if(!j.out) return j.date===TODAY ? ['En turno','c-info'] : ['Sin salida','c-bad'];
  const w = [j.in.s,j.out.s].sort((a,b)=>RANK[b]-RANK[a])[0];
  return w==='ok'||w==='aceptada' ? ['Completa','c-ok'] : ST[w];
}
const hasIssue = j => { const s=jStatus(j)[0]; return s!=='Completa' && s!=='En turno'; };
function cellTime(j,part){
  const p = j[part];
  if(!p) return `<button class="tcell empty" data-jedit="${j.id}" data-focus="${part}" title="Agregar ${part==='in'?'entrada':'salida'}">+ Agregar</button>`;
  const dot = {ok:'#1FA463',aceptada:'#1FA463',obs:'#E0A100',alerta:'#D93A26',rechazada:'#D93A26',sync:'#0071CE'}[p.s];
  return `<button class="tcell" data-jedit="${j.id}" data-focus="${part}" title="${p.m} · ${p.d} · ${ST[p.s][0]}"><i style="background:${dot}"></i><b>${p.t}</b><span>${p.m}${p.d!=='—'?' · '+p.d:''}</span></button>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function now(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function log(a){LOG.unshift({when:now(),who:'Admin principal',action:a});}
let tt; function toast(m){$('#toastTxt').textContent=m;$('#toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('show'),2800);}
function openModal(html){$('#dlg').innerHTML=html;$('#modal').classList.add('show');}
function closeModal(){$('#modal').classList.remove('show');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function go(h){location.hash=h;}
const I = {
  home:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  list:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  users:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c1-4 4-6 7-6s6 2 7 6M17 11a3 3 0 1 0 0-6M22 21c-.5-3-2-4.5-4-5"/></svg>',
  cd:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-6h6v6"/></svg>',

function calendar(uid){
  const pattern = ['ok','ok','ok','ok','ok','off','off','ok','obs','ok','ok','ok','off','off','ok','ok','late','ok','ok','off','off','ok','ok','ok','ok','ok','off','off','ok','ok'];
  const colors = {ok:'var(--ok-bg)',obs:'var(--warn-bg)',late:'var(--bad-bg)',off:'var(--track)',fut:'transparent'};
  const tc = {ok:'var(--ok)',obs:'var(--warn)',late:'var(--bad)',off:'var(--muted)',fut:'var(--muted)'};
  let cells = '';
  for(let i=0;i<6;i++) cells += '<div></div>'; // nov 2026 empieza domingo -> offset con L-D? usamos D..S
  cells='';
  // Noviembre 2026 inicia en domingo
  for(let d=1; d<=30; d++){ const s = d>10?'fut':pattern[(d+uid)%pattern.length]; cells += `<div class="d" style="background:${colors[s]};color:${tc[s]};${s==='fut'?'border:1px dashed var(--border)':''}">${d}</div>`; }
  return `<div class="cal" style="margin-bottom:6px">${['D','L','M','M','J','V','S'].map(x=>`<div class="muted" style="text-align:center;font-size:11px;font-weight:700">${x}</div>`).join('')}</div><div class="cal">${cells}</div>
  <div class="legend" style="margin-top:10px"><span><b style="background:var(--ok-bg)"></b>A tiempo</span><span><b style="background:var(--warn-bg)"></b>Con observación</span><span><b style="background:var(--bad-bg)"></b>Tardanza / sin salida</span><span><b style="background:var(--track)"></b>Libre</span></div>`;
}

function fakeQr(seed){
  let s=seed,cells='';const n=21;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const fin=(r,c,r0,c0)=>{const y=r-r0,x=c-c0;if(y<0||x<0||y>6||x>6)return null;return y===0||y===6||x===0||x===6||(y>=2&&y<=4&&x>=2&&x<=4);};
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){let f=fin(r,c,0,0);if(f===null)f=fin(r,c,0,n-7);if(f===null)f=fin(r,c,n-7,0);const on=f!==null?f:rnd()>.5;if(on)cells+=`<rect x="${c}" y="${r}" width="1" height="1"/>`;}
  return `<svg viewBox="-1 -1 23 23" width="150" height="150" role="img" aria-label="QR de ejemplo" style="background:#fff;border-radius:8px"><g fill="#041E42">${cells}</g></svg>`;
}

      <div class="pills">${[30,60,90,120,180].map(d=>`<button class="pill ${CFG.retention===d?'on':''}" data-ret="${d}">${d} días</button>`).join('')}</div>
      <b>Se conservan ${CFG.retention} días · próximo borrado: hoy 23:00</b>
      <div><div class="muted" style="font-size:12px;margin-bottom:6px">Uso del plan gratis de Firestore</div><div class="bar"><div style="width:3%"></div></div><div class="muted" style="font-size:12px;margin-top:4px">≈ 3% de 1 GiB</div></div>
    </section>
    <section class="card" style="display:flex;flex-direction:column;gap:12px"><h2>Apariencia</h2>
      <div class="pills">${[['claro','Claro'],['oscuro','Oscuro'],['auto','Automático']].map(([k,l])=>`<button class="pill ${CFG.theme===k?'on':''}" data-theme="${k}">${l}</button>`).join('')}</div>
      <label class="field">Nombre de la app<input id="appname" value="${esc(CFG.appName)}"></label>
      <label class="field">Días para volver a cambiar la firma<input type="number" id="sigdays" value="${CFG.sigDays}" min="1"></label>
      <button class="btn pri" data-act="savecfg" style="justify-content:center">Guardar</button>
    </section>
    <section class="card" style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2>Administradores</h2><button class="btn sm pri" data-act="addadmin">+ Agregar</button></div>
      <span class="muted" style="font-size:12px">Todos tienen el mismo nivel que el admin principal.</span>
      ${ADMINS.map(a=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)"><div><b>${esc(a.name)}</b><div class="muted" style="font-size:12px">${esc(a.email)} · desde ${a.since}</div></div><span class="chip c-navy">Admin</span></div>`).join('')}
    </section>
  </div>`,{noFilter:true});
}

function vPerfil(){
  return shell('','Mi perfil','Admin principal',`
  <section class="card" style="max-width:560px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;gap:14px;align-items:center"><span class="av" style="width:56px;height:56px;border-radius:16px;font-size:20px">AP</span><div><b style="font-size:18px">Admin principal</b><div class="muted">admin.cd@gmail.com · Acceso con Google</div></div></div>
    <div class="f2"><label class="field">Nombre<input value="Admin"></label><label class="field">Apellidos<input value="Principal"></label></div>
    <div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap"><button class="btn pri" data-act="saveprof">Guardar</button><button class="btn danger" data-act="logout">Cerrar sesión</button></div>
  </section>`,{noFilter:true});
}
function vNotFound(){return shell('','No encontrado','Esa pantalla no existe',`<a class="btn pri" href="#resumen">Ir al resumen</a>`,{noFilter:true});}

/* ===================== ROUTER ===================== */
function render(){
  const h = (location.hash||'').slice(1) || (UI.logged?'resumen':'login');
  if(!UI.logged && h!=='login'){ UI.logged = true; } // al abrir un enlace directo, entra sin pedir login
  let html;
  if(h==='login') html = vLogin();
  else if(h==='resumen') html = vResumen();
  else if(h==='asistencia') html = vAsistencia();
  else if(h.startsWith('guardia-')) html = vGuardia(Number(h.split('-')[1]));
  else if(h==='usuarios') html = vUsuarios();
  else if(h==='nuevo-usuario') html = userForm(null);
  else if(h.startsWith('editar-usuario-')) html = userForm(u(Number(h.split('-')[2])));
  else if(h==='cds') html = vCds();
  else if(h==='nuevo-cd') html = vNuevoCd();
  else if(h.startsWith('cd-')) html = vCd(h.slice(3));
  else if(h==='alertas') html = vAlertas();
  else if(h.startsWith('alerta-')) html = vAlerta(Number(h.split('-')[1]));
  else if(h==='reportes') html = vReportes();
  else if(h==='qr') html = vQr();
  else if(h==='firmas') html = vFirmas();
  else if(h==='bitacora') html = vBitacora();
  else if(h==='config') html = vConfig();
  else if(h==='perfil') html = vPerfil();
  else html = vNotFound();
  $('#root').innerHTML = html;
  document.body.classList.toggle('dark', CFG.theme==='oscuro');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);

/* ===================== EVENTOS ===================== */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-cd],[data-utab],[data-date],[data-approve],[data-reject],[data-block],[data-del],[data-uedit],[data-unlock],[data-jedit],[data-issues],[data-reason],[data-accept],[data-rejecta],[data-qr],[data-rot],[data-ret],[data-theme],[data-act],[data-go],#burger');
  if(!t) { if(window.innerWidth<=900 && !e.target.closest('#side')) { const s=$('#side'); if(s) s.classList.remove('open'); } return; }
  const d = t.dataset;
  if(t.id==='burger'){ $('#side').classList.toggle('open'); return; }
  if(d.go){ go(d.go); return; }
  if(d.cd){ UI.cd=d.cd; render(); return; }
  if(d.utab){ UI.userTab=d.utab; render(); return; }
  if(d.date){ UI.assistDate=d.date; render(); toast('Mostrando: '+d.date); return; }
  if(d.approve){ const x=u(+d.approve); x.status='Activo'; log('Aprobó el registro de '+full(x)+' ('+x.role+' · '+cdName(x.cd)+')'); render(); toast(full(x)+' aprobado: ya puede marcar'); return; }
  if(d.reject){ const x=u(+d.reject); USERS=USERS.filter(y=>y!==x); log('Rechazó el registro de '+full(x)); render(); toast('Registro rechazado'); return; }
  if(d.block){ const x=u(+d.block); x.status = x.status==='Bloqueado'?'Activo':'Bloqueado'; log((x.status==='Bloqueado'?'Bloqueó a ':'Desbloqueó a ')+full(x)); render(); toast(x.status==='Bloqueado'?full(x)+' bloqueado: no puede entrar ni marcar':full(x)+' desbloqueado'); return; }
  if(d.del){ const x=u(+d.del); openModal(`<h2 style="font-size:18px">¿Eliminar a ${full(x)}?</h2><p class="muted" style="margin:0">Se borra su cuenta. Sus marcaciones se conservan hasta que venza la retención.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="close">Cancelar</button><button class="btn danger" data-act="confirmdel" data-id="${x.id}">Eliminar</button></div>`); return; }
  if(d.uedit){ go('editar-usuario-'+d.uedit); return; }
  if(d.unlock){ const x=u(+d.unlock); x.sig.locked=false; log('Habilitó cambio de firma para '+full(x)); render(); toast('Se notificó a '+full(x)+' que puede cambiar su firma'); return; }
  if(d.jedit){ editJornada(+d.jedit, d.focus||'in'); return; }
  if(d.issues){ UI.onlyIssues=!UI.onlyIssues; render(); return; }
  if(d.reason){ const r=$('#jreason'); r.value = r.value ? r.value+'. '+d.reason : d.reason; return; }
  if(d.accept||d.rejecta){ const a=ALERTS.find(y=>y.id===+(d.accept||d.rejecta)); a.state=d.accept?'aceptada':'rechazada'; const j=JORN.find(y=>y.id===a.jid); if(j&&j[a.part]) j[a.part].s=a.state; log((d.accept?'Aceptó':'Rechazó')+' la marca de '+full(u(a.uid))+' ('+a.text+')'); render(); toast(d.accept?'Marca aceptada':'Marca rechazada'); return; }
  if(d.qr){ const c=CDS.find(y=>y.code===d.qr); c.qr=!c.qr; log((c.qr?'Habilitó':'Deshabilitó')+' el QR en '+cdName(c.code)); render(); toast('QR '+(c.qr?'habilitado':'deshabilitado')+' en '+c.name); return; }
  if(d.rot){ const [code,s]=d.rot.split(':'); const c=CDS.find(y=>y.code===code); c.rot=+s; log('Cambió la rotación del QR de '+cdName(code)+' a '+s+' s'); render(); toast('El QR de '+c.name+' cambiará cada '+s+' s'); return; }
  if(d.ret){ CFG.retention=+d.ret; log('Cambió la retención de datos a '+d.ret+' días'); render(); toast('Retención: '+d.ret+' días'); return; }
  if(d.theme){ CFG.theme=d.theme; render(); toast('Tema: '+t.textContent); return; }
  const act = d.act;
  if(act==='login'){ UI.logged=true; go('resumen'); return; }
  if(act==='noop'){ e.preventDefault(); toast('Registro: correo, contraseña, nombre, apellidos, CD y firma'); return; }
  if(act==='close'){ closeModal(); return; }
  if(act==='confirmdel'){ const x=u(+d.id); USERS=USERS.filter(y=>y!==x); log('Eliminó al usuario '+full(x)); closeModal(); render(); toast('Usuario eliminado'); return; }
  if(act==='savejorn'){ const r=$('#jreason').value.trim(); if(!r){ $('#jreason').focus(); toast('Escribe el motivo antes de guardar'); return; }
    const j=JORN.find(y=>y.id===+d.id); const ni=$('#jin').value, no=$('#jout').value; const ch=[];
    if(ni && ni!==j.in.t){ ch.push('entrada '+j.in.t+' → '+ni); j.in={t:ni,m:'Editada por admin',d:'—',s:'ok'}; }
    const oldOut = j.out?j.out.t:'—';
    if(no && no!==oldOut){ ch.push('salida '+oldOut+' → '+no); j.out={t:no,m:'Editada por admin',d:'—',s:'ok'}; }
    if(!ch.length){ toast('No cambiaste ninguna hora'); return; }
    j.edited=true;
    ALERTS.filter(a=>a.jid===j.id&&a.state==='abierta').forEach(a=>a.state='aceptada');
    log('Corrigió la jornada de '+full(u(j.uid))+' del '+j.date+': '+ch.join(', ')+'. Motivo: '+r); closeModal(); render(); toast('Jornada corregida y registrada en la bitácora'); return; }
  if(act==='savecd'){ log('Actualizó geocerca y turnos de un CD'); toast('Cambios del CD guardados'); return; }
  if(act==='savecfg'){ CFG.appName=$('#appname').value||CFG.appName; CFG.sigDays=+$('#sigdays').value||CFG.sigDays; log('Actualizó la configuración general'); render(); toast('Configuración guardada'); return; }
  if(act==='addadmin'){ openModal(`<h2 style="font-size:18px">Agregar administrador</h2><label class="field">Usuario<select id="newadmin">${USERS.filter(x=>x.role!=='Admin'&&x.status==='Activo').map(x=>`<option value="${x.id}">${full(x)} · ${x.role}</option>`).join('')}</select></label><div class="muted" style="font-size:12px">Tendrá el mismo nivel que el admin principal.</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="confirmadmin">Agregar</button></div>`); return; }
  if(act==='confirmadmin'){ const x=u(+$('#newadmin').value); x.role='Admin'; ADMINS.push({name:full(x),email:x.email,since:now().split(' ')[0]+'/2026'}); log('Dio rol de administrador a '+full(x)); closeModal(); render(); toast(full(x)+' ahora es administrador'); return; }
  if(act==='dl'){ toast('En la app real se descarga el archivo'); return; }
  if(act==='saveprof'){ toast('Perfil guardado'); return; }
  if(act==='logout'){ UI.logged=false; go('login'); return; }
});
document.addEventListener('input', e=>{
  if(e.target.id==='radius'){ $('#rv').textContent=e.target.value+' m'; }
  if(e.target.id==='q'){ UI.q=e.target.value; render(); const q=$('#q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
  if(e.target.id==='jin'||e.target.id==='jout'){ const i=$('#jin').value,o=$('#jout').value; if(i&&o){ let m=toMin(o)-toMin(i); if(m<0)m+=1440; $('#jh').textContent=Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'; } }
});
document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='uform'){ const f=new FormData(e.target); const id=e.target.dataset.id;
    if(id){ const x=u(+id); Object.assign(x,{first:f.get('first'),last:f.get('last'),email:f.get('email'),role:f.get('role'),cd:f.get('cd')}); log('Editó los datos de '+full(x)); toast('Cambios guardados'); }
    else { const nid=Math.max(...USERS.map(x=>x.id))+1; USERS.push({id:nid,first:f.get('first'),last:f.get('last'),email:f.get('email'),role:f.get('role'),cd:f.get('cd'),status:'Activo',via:'Correo',sig:null,created:'10/11/2026'}); log('Creó el usuario '+f.get('first')+' '+f.get('last')); UI.userTab='Activo'; toast('Usuario creado; recibirá un correo para su contraseña'); }
    go('usuarios'); }
  if(e.target.id==='cdform'){ const f=new FormData(e.target); CDS.push({code:f.get('code'),name:f.get('name'),lat:'13.70',lng:'-89.20',radius:150,alert:1000,pa:'Sin asignar',guards:0,onDuty:0,qr:false,rot:30,kiosk:null}); log('Agregó el CD '+f.get('name')+' '+f.get('code')); toast('CD agregado'); go('cds'); }
  if(e.target.id==='rform'){ const fmt=(e.submitter&&e.submitter.value)||'Excel'; const f=new FormData(e.target); REPORTS.unshift({name:f.get('tipo')+' · '+f.get('cd'),range:'01/11 – 15/11',fmt,by:'Admin principal',when:now()}); log('Generó reporte '+fmt+': '+f.get('tipo')); render(); toast('Reporte '+fmt+' generado'); }
});

render();
</script>
</body>
</html>
